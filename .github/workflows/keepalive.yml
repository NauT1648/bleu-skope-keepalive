name: keepalive
on:
  schedule:
    # Every 10 min, offset off the hour. UTC 23:00-10:59 = 10am-10pm Melbourne (AEDT, until Apr 2027)
    - cron: '7,17,27,37,47,57 23,0-10 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://bleu-skope-backend.onrender.com/health
